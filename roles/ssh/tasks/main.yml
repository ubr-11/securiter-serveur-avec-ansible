---
- name: Installer openssh-server
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true

- name: Verifier que la cle publique existe sur la machine de controle
  ansible.builtin.stat:
    path: "{{ ssh_public_key_file | expanduser }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: ssh_pubkey

- name: Stopper si la cle publique est absente
  ansible.builtin.assert:
    that: ssh_pubkey.stat.exists
    fail_msg: "Cle publique introuvable. Cree-la avec : ssh-keygen -t ed25519"
  run_once: true

- name: Deployer la cle publique sur le serveur
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ lookup('ansible.builtin.file', ssh_public_key_file | expanduser) }}"
    state: present

- name: Durcir ssh
  ansible.builtin.template:
    src: 01-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/01-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
